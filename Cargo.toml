[workspace]
resolver = "3"
members = [
  "crates/tocat-api",
  "crates/tocat-cli",
  "crates/tocat-core",
  "crates/tocat-plugins",
  "crates/tocat-tui",
  "crates/tocat-wasm-abi",
  "crates/tocat-wasm-sdk",
  "crates/tocat-wasm-shell"
]
exclude = ["examples/"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.94.1"
repository = "https://github.com/lkalir/tocat"
license = "MIT OR Apache-2.0"
keywords = ["netcat", "proxy", "relay", "socat", "tcp"]

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
rustix = "1.1.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tocat-api = { path = "crates/tocat-api", version = "0.2.1" }
tocat-wasm-abi = { path = "crates/tocat-wasm-abi", version = "0.2.1" }
tokio = "1.53.1"
toml = "1.1.4"
wasmtime = "47.0.4"

[workspace.dependencies.tocat-core]
path = "crates/tocat-core"
version = "0.2.1"
default-features = false

[workspace.dependencies.tocat-plugins]
path = "crates/tocat-plugins"
version = "0.2.1"
default-features = false

[profile.ci]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"
