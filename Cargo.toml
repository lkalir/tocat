[workspace]
resolver = "3"
members = [
  "crates/plugins/*",
  "crates/tocat-api",
  "crates/tocat-cli",
  "crates/tocat-plugins"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/lkalir/tocat"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tocat-api = { path = "crates/tocat-api" }

[profile.release]
debug = 1
