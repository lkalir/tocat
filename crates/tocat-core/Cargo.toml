[package]
name = "tocat-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The relay behind tocat: endpoints, layers, and the plugin pipeline"
repository.workspace = true
license.workspace = true
keywords = ["networking", "proxy", "relay", "socat", "tokio"]
categories = ["asynchronous", "network-programming"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
console-subscriber = { version = "0.5.0", optional = true }
futures = "0.3.33"
futures-util = "0.3.33"
pty-process = { version = "0.5.3", features = ["async"] }
rustix = {
  workspace = true,
  features = ["fs", "net", "pipe", "pty", "termios"]
}
rustls = {
  version = "0.23.43",
  default-features = false,
  features = ["aws-lc-rs", "logging", "std", "tls12"]
}
rustls-native-certs = "0.8.4"
rustls-pemfile = "2.2.0"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10.9"
tocat-api = { workspace = true }
tocat-plugins = { workspace = true }
tokio = {
  version = "1.53.1",
  features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time"
  ]
}
tokio-rustls = {
  version = "0.26.4",
  default-features = false,
  features = ["aws-lc-rs", "logging", "tls12"]
}
tokio-seqpacket = "0.9.1"
tokio-tungstenite = {
  version = "0.30.0",
  default-features = false,
  features = ["handshake"]
}
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"

[dev-dependencies]
rcgen = "0.14.9"
tempfile = "3.27.0"
toml = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }
