[package]
name = "tocat-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The relay behind tocat: endpoints, layers, and the plugin pipeline"
repository.workspace = true
license.workspace = true
keywords = ["networking", "proxy", "relay", "socat", "tokio"]
categories = ["asynchronous", "network-programming"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
console-subscriber = { version = "0.5.0", optional = true }
futures = "0.3.34"
futures-util = "0.3.34"
pty-process = { version = "0.5.3", features = ["async"] }
rustix = {
  workspace = true,
  features = ["fs", "net", "pipe", "pty", "termios"]
}
rustls = {
  version = "0.23.43",
  default-features = false,
  features = ["aws-lc-rs", "logging", "prefer-post-quantum", "std", "tls12"]
}
rustls-native-certs = "0.8.4"
rustls-pki-types = "1.15.1"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11.0"
snow = {
  version = "0.10.0",
  default-features = false,
  features = [
    "std",
    "use-aes-gcm",
    "use-blake2",
    "use-chacha20poly1305",
    "use-curve25519",
    "use-getrandom",
    "use-p256",
    "use-sha2",
    "use-xchacha20poly1305"
  ]
}
tocat-api = { workspace = true }
tocat-plugins = { workspace = true }
tokio = {
  version = "1.53.1",
  features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time"
  ]
}
tokio-rustls = {
  version = "0.26.4",
  default-features = false,
  features = ["aws-lc-rs", "logging", "tls12"]
}
tokio-seqpacket = "0.9.1"
tokio-tungstenite = {
  version = "0.30.0",
  default-features = false,
  features = ["handshake"]
}
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"
tun-rs = { version = "2.8.9", features = ["async"] }

[dev-dependencies]
rcgen = "0.14.10"
tempfile = "3.27.0"
toml = { workspace = true }

[features]
default = ["all-plugins"]
all-plugins = ["all-plugins-no-wasm", "wasm"]
all-plugins-no-wasm = [
  "base64",
  "block",
  "compress",
  "encrypt",
  "frame",
  "hash",
  "hexify",
  "limit",
  "process",
  "rate",
  "tee",
  "throttle",
  "timeout"
]
base64 = ["tocat-plugins/base64"]
block = ["tocat-plugins/block"]
compress = ["tocat-plugins/compress"]
encrypt = ["tocat-plugins/encrypt"]
frame = ["tocat-plugins/frame"]
hash = ["tocat-plugins/hash"]
hexify = ["tocat-plugins/hexify"]
limit = ["tocat-plugins/limit"]
process = ["tocat-plugins/process"]
rate = ["tocat-plugins/rate"]
tee = ["tocat-plugins/tee"]
throttle = ["tocat-plugins/throttle"]
timeout = ["tocat-plugins/timeout"]
wasm = ["tocat-plugins/wasm"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }
