[package]
name = "tocat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A socat-inspired relay with a config file and a plugin pipeline"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
console-subscriber = { version = "0.5.0", optional = true }
rustix = { workspace = true, features = ["termios"] }
serde = { workspace = true }
serde_json = { workspace = true }
tocat-api = { workspace = true }
tocat-core = { workspace = true }
tokio = {
  workspace = true,
  features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time"
  ]
}
toml = { workspace = true }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
# The tls tests generate a certificate rather than carrying a fixture with an
# expiry date in it.
rcgen = "0.14.10"
tempfile = "3.27.0"

[features]
default = ["all-plugins", "schema"]
all-plugins = ["all-plugins-no-wasm", "wasm"]
all-plugins-no-wasm = [
  "base64",
  "block",
  "compress",
  "encrypt",
  "frame",
  "hash",
  "hexify",
  "limit",
  "process",
  "rate",
  "tee",
  "throttle",
  "timeout",
]
base64 = ["tocat-core/base64"]
block = ["tocat-core/block"]
compress = ["tocat-core/compress"]
encrypt = ["tocat-core/encrypt"]
frame = ["tocat-core/frame"]
hash = ["tocat-core/hash"]
hexify = ["tocat-core/hexify"]
limit = ["tocat-core/limit"]
process = ["tocat-core/process"]
rate = ["tocat-core/rate"]
schema = []
tee = ["tocat-core/tee"]
throttle = ["tocat-core/throttle"]
timeout = ["tocat-core/timeout"]
tokio-console = ["dep:console-subscriber"]
wasm = ["tocat-core/wasm"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }
