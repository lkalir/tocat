[package]
name = "tocat-cli"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "tocat"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
console-subscriber = { version = "0.5.0", optional = true }
futures = "0.3.33"
futures-util = "0.3.33"
nix = { version = "0.31.3", features = ["fs"] }
serde = { workspace = true }
serde_json = { workspace = true }
tocat-api = { workspace = true }
tocat-plugins = { path = "../tocat-plugins", default-features = false }
tokio = {
  version = "1.53.1",
  features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync"
  ]
}
tokio-util = { version = "0.7.19", features = ["rt"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[features]
default = ["all-plugins"]
all-plugins = ["compress", "process", "tee"]
compress = ["tocat-plugins/compress"]
process = ["tocat-plugins/process"]
tee = ["tocat-plugins/tee"]
tokio-console = ["dep:console-subscriber"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }
