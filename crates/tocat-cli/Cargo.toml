[package]
name = "tocat"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
console-subscriber = { version = "0.5.0", optional = true }
futures = "0.3.33"
futures-util = "0.3.33"
rustix = { version = "1.1.4", features = ["fs", "pipe", "termios"] }
serde = { workspace = true }
serde_json = { workspace = true }
tocat-api = { workspace = true }
tocat-plugins = { path = "../tocat-plugins", version = "0.1.0", default-features = false }
tokio = {
  version = "1.53.1",
  features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time"
  ]
}
tokio-util = { version = "0.7.19", features = ["rt"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[features]
default = ["all-plugins"]
all-plugins = [
  "block",
  "compress",
  "limit",
  "process",
  "rate",
  "tee",
  "throttle",
  "timeout",
  "wasm"
]
all-plugins-no-wasm = [
  "block",
  "compress",
  "limit",
  "process",
  "rate",
  "tee",
  "throttle",
  "timeout",
]
block = ["tocat-plugins/block"]
compress = ["tocat-plugins/compress"]
limit = ["tocat-plugins/limit"]
process = ["tocat-plugins/process"]
rate = ["tocat-plugins/rate"]
tee = ["tocat-plugins/tee"]
throttle = ["tocat-plugins/throttle"]
timeout = ["tocat-plugins/timeout"]
tokio-console = ["dep:console-subscriber"]
wasm = ["tocat-plugins/wasm"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }
