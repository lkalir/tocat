[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained rather than vulnerable, and the advisory itself says no safe upgrade exists. It arrives three levels under tun-rs, through netconfig-rs and route_manager into netlink-packet-core, so there is nothing to pin here. It is a proc-macro, so it runs at build time and is not part of the shipped binary. Revisit when the netlink crates move to pastey." }
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[[licenses.clarify]]
name = "aws-lc-sys"
expression = "Apache-2.0 AND ISC AND OpenSSL"
license-files = []

[[licenses.exceptions]]
name = "aws-lc-sys"
allow = ["OpenSSL"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

deny = [
  { name = "rustls-pemfile", reason = "unmaintained; use rustls-pki-types::PemObject" },
  { name = "openssl-sys", reason = "tls is rustls here" },
  { name = "native-tls", reason = "tls is rustls here" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
